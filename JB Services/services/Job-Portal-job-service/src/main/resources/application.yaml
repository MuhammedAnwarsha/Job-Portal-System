
server:
  port: 5003

spring:
  application:
    name: Job-Portal-job-service

  datasource:
    url: jdbc:postgresql://localhost:5432/job_portal_job
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org.springframework.security: DEBUG
